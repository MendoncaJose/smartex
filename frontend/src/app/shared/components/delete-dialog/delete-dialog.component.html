<h2 mat-dialog-title>Confirm delete</h2>

<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="ref.close(false)">Cancel</button>
  <button mat-flat-button color="warn" (click)="ref.close(true)">
    {{ data.confirmLabel ?? 'Delete' }}
  </button>
</mat-dialog-actions>
