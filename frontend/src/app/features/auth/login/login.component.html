<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <h1 class="auth-logo">SmartEX</h1>
      <p class="auth-subtitle">Sign in to SmartEX</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="email" maxlength="255" />
        @if (form.get('email')?.hasError('required')) {
          <mat-error>Email is required</mat-error>
        } @else if (form.get('email')?.hasError('email')) {
          <mat-error>Enter a valid email</mat-error>
        }
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input matInput type="password" formControlName="password" autocomplete="current-password" maxlength="128" />
        @if (form.get('password')?.hasError('required')) {
          <mat-error>Password is required</mat-error>
        }
      </mat-form-field>

      <button
        mat-flat-button
        type="submit"
        [disabled]="loading()"
        class="auth-submit"
      >
        @if (loading()) {
          <mat-spinner diameter="20" />
        } @else {
          Sign in
        }
      </button>
    </form>

    <p class="auth-footer">
      Don't have an account?
      <a routerLink="/register">Create one</a>
    </p>
  </div>
</div>
