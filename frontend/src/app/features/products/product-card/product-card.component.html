<mat-card class="product-card">
  <mat-card-content>
    <p class="price">{{ product().price | currency:'EUR' }}</p>
    <h3 class="title">{{ product().title }}</h3>
    @if (product().description) {
      <p class="description">{{ product().description }}</p>
    }
    <div class="chips">
      @for (cat of product().categories; track cat.id) {
        <mat-chip>{{ cat.name }}</mat-chip>
      }
    </div>
  </mat-card-content>

  <mat-card-actions align="end">
    <button mat-icon-button matTooltip="Edit" aria-label="Edit product" (click)="edit.emit(product())">
      <mat-icon aria-hidden="true">edit</mat-icon>
    </button>
    <button mat-icon-button matTooltip="Delete" aria-label="Delete product" color="warn" (click)="delete.emit(product())">
      <mat-icon aria-hidden="true">delete</mat-icon>
    </button>
  </mat-card-actions>
</mat-card>
