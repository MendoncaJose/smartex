<div class="page-container">

  <!-- Toolbar -->
  <div class="page-toolbar">
    <h1 class="page-title">Categories</h1>

    <div class="toolbar-actions">
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Search</mat-label>
        <mat-icon matPrefix>search</mat-icon>
        <input matInput [formControl]="searchControl" placeholder="Search categories..." />
      </mat-form-field>

      <button mat-flat-button (click)="openCreate()">
        <mat-icon>add</mat-icon>
        New category
      </button>
    </div>
  </div>

  <!-- Loading -->
  @if (loading()) {
    <div class="loading-state">
      <mat-spinner diameter="48" />
    </div>
  } @else if (filtered().length === 0) {
    <div class="empty-state">
      <mat-icon>category</mat-icon>
      <p>{{ categories().length === 0 ? 'No categories yet' : 'No results for "' + searchControl.value + '"' }}</p>
    </div>
  } @else {
    <div class="table-wrapper">
      <table mat-table [dataSource]="filtered()">

        <!-- Name -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let cat">{{ cat.name }}</td>
        </ng-container>

        <!-- Created -->
        <ng-container matColumnDef="createdAt">
          <th mat-header-cell *matHeaderCellDef>Created</th>
          <td mat-cell *matCellDef="let cat">{{ cat.createdAt | date: 'dd MMM yyyy' }}</td>
        </ng-container>

        <!-- Actions -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let cat" class="actions-cell">
            <button mat-icon-button matTooltip="Edit" (click)="openEdit(cat)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button matTooltip="Delete" color="warn" (click)="confirmDelete(cat)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columns"></tr>
        <tr mat-row *matRowDef="let row; columns: columns"></tr>

      </table>
    </div>
  }

</div>
